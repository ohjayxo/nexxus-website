# Plain static site: there is nothing to build.
# Publish the repository root as-is. This file overrides the build
# settings in the Netlify dashboard, so the deploy setup lives in the repo.
[build]
  publish = "."
  command = "echo 'Static site: no build step'"

# _tools/ holds maintenance scripts for the repo, not pages. Don't serve it.
[[redirects]]
  from = "/_tools/*"
  to = "/404.html"
  status = 404
  force = true
